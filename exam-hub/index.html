<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiks Exam Hub</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#173d48;background:linear-gradient(160deg,#0d666c,#24b8a8 45%,#e8faf7);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:24px}.hero,.card{border-radius:24px;padding:22px;margin-bottom:18px}.hero{background:#0b555e;color:white}.card{background:white;box-shadow:0 10px 30px #003a4625}.tabs{display:flex;gap:10px;margin:16px 0}.tabs button,.btn{border:0;border-radius:12px;padding:13px 18px;background:#0d6971;color:white;font-weight:800;cursor:pointer}.tabs button.off,.btn.off{background:#e8f0f2;color:#0d6971}input,textarea{width:100%;padding:13px;border:1px solid #cbdde4;border-radius:12px;margin:6px 0 12px;font:inherit}label{font-weight:800}.hidden{display:none}.error{background:#fff0ee;color:#a52c20;padding:12px;border-radius:10px}.success{background:#e7f8ef;color:#087a55;padding:12px;border-radius:10px}.question{border:1px solid #dce8eb;border-radius:16px;padding:16px;margin:12px 0}.option{display:block;width:100%;text-align:left;background:#f4f8f9;color:#173d48;margin:7px 0}.option.selected{background:#d5f2ee;border:2px solid #0d6971}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:220px}.timer{font-size:24px;font-weight:900;float:right}@media(max-width:600px){.wrap{padding:12px}.hero,.card{padding:16px}}
</style></head><body><main class="wrap"><section class="hero"><h1>Quiks Exam Hub</h1><p>Local-network examination delivery. Candidate responses remain on this school computer and are not sent to Quiks.</p></section><div class="tabs"><button id="studentTab">Candidate</button><button id="adminTab" class="off">Administrator</button></div>
<section id="admin" class="card hidden"><h2>Load an examination package</h2><label>Exam Hub administrator PIN</label><input id="pin" type="password"><label>Student .qexam package</label><input id="package" type="file" accept=".qexam,application/json"><label>Package activation code</label><input id="activation" type="password"><label>Candidate join code</label><input id="joinSet" placeholder="e.g. BIO-2026"><button class="btn" id="load">Open exam on this network</button><button class="btn off" id="export">Export local responses as CSV</button><div id="adminMessage"></div><hr><h2>Open the local marking guide</h2><label>Teacher .qmark package</label><input id="markingPackage" type="file" accept=".qmark,application/json"><label>Teacher-package password</label><input id="markingPassword" type="password"><button class="btn" id="openMarking">Open marking guide</button><div id="markingMessage"></div><div id="markingGuide"></div></section>
<section id="student" class="card"><div id="join"><h2>Join examination</h2><label>Candidate name</label><input id="name"><label>Candidate or admission number</label><input id="number"><label>Join code from the proctor</label><input id="joinCode"><button class="btn" id="start">Start examination</button><div id="studentMessage"></div></div><div id="exam" class="hidden"><span id="timer" class="timer"></span><h2 id="title"></h2><p id="meta"></p><div id="questions"></div><button class="btn" id="submit">Submit to this Exam Hub</button></div></section></main><script>
const $=id=>document.getElementById(id);let attemptId=null,exam=null,startedAt=0,answers={},securityEvents=[];
function message(target,text,error=false){target.replaceChildren();const paragraph=document.createElement('p');paragraph.className=error?'error':'success';paragraph.textContent=text;target.appendChild(paragraph)}
function tab(admin){$('admin').classList.toggle('hidden',!admin);$('student').classList.toggle('hidden',admin);$('adminTab').classList.toggle('off',!admin);$('studentTab').classList.toggle('off',admin)}$('adminTab').onclick=()=>tab(true);$('studentTab').onclick=()=>tab(false);
$('load').onclick=async()=>{try{const file=$('package').files[0];if(!file)throw Error('Choose a .qexam file.');const response=await fetch('/api/admin/package',{method:'POST',headers:{'Content-Type':'application/json','X-Quiks-Exam-Hub-Pin':$('pin').value},body:JSON.stringify({package:await file.text(),activationCode:$('activation').value,joinCode:$('joinSet').value})});const data=await response.json();if(!response.ok)throw Error(data.error);message($('adminMessage'),`${data.title} is ready for ${data.className}. Students may now connect to this computer.`)}catch(error){message($('adminMessage'),error.message,true)}};
$('export').onclick=async()=>{try{const response=await fetch('/api/admin/export',{headers:{'X-Quiks-Exam-Hub-Pin':$('pin').value}});if(!response.ok)throw Error((await response.json()).error);const url=URL.createObjectURL(await response.blob());const a=document.createElement('a');a.href=url;a.download='quiks-exam-hub-results.csv';a.click();URL.revokeObjectURL(url)}catch(error){message($('adminMessage'),error.message,true)}};
$('openMarking').onclick=async()=>{try{const file=$('markingPackage').files[0];if(!file)throw Error('Choose a .qmark file.');const response=await fetch('/api/admin/marking-package',{method:'POST',headers:{'Content-Type':'application/json','X-Quiks-Exam-Hub-Pin':$('pin').value},body:JSON.stringify({package:await file.text(),password:$('markingPassword').value})});const data=await response.json();if(!response.ok)throw Error(data.error);message($('markingMessage'),`${data.title} marking guide opened.`);const root=$('markingGuide');root.replaceChildren();data.questions.forEach((question,index)=>{const section=document.createElement('section');section.className='question';const heading=document.createElement('h3');heading.textContent=`${index+1}. ${question.prompt} (${question.points} mark${question.points===1?'':'s'})`;const answer=document.createElement('p');answer.textContent=`Answer: ${question.answer||'Teacher marked'}`;section.append(heading,answer);if(question.markingGuide){const guide=document.createElement('p');guide.textContent=`Marking guide: ${question.markingGuide}`;section.appendChild(guide)}if(question.explanation){const explanation=document.createElement('p');explanation.textContent=`Explanation: ${question.explanation}`;section.appendChild(explanation)}root.appendChild(section)})}catch(error){message($('markingMessage'),error.message,true)}};
function responseBody(){return{attemptId,answers:Object.entries(answers).map(([questionId,answer])=>({questionId,answer})),securityEvents}}let saveTimer=null;function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveDraft(),400)}async function saveDraft(){if(!attemptId)return;try{await fetch('/api/attempt/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(responseBody())})}catch{}}
function render(){ $('title').textContent=exam.title;$('meta').textContent=`${exam.className} · ${exam.subjectName} · ${exam.durationMinutes} minutes`;const root=$('questions');root.innerHTML='';exam.questions.forEach((q,index)=>{const section=document.createElement('section');section.className='question';const heading=document.createElement('h3');heading.textContent=`${index+1}. ${q.prompt}${exam.showQuestionPoints?` (${q.points} mark${q.points===1?'':'s'})`:''}`;section.appendChild(heading);if(q.image){const image=document.createElement('img');image.src=`data:${q.image.mimeType};base64,${q.image.dataBase64}`;image.style='max-width:100%;max-height:300px';section.appendChild(image)}if(q.type==='written'){const area=document.createElement('textarea');area.rows=6;area.placeholder='Write your answer';area.value=answers[q.id]||'';area.oninput=()=>{answers[q.id]=area.value;queueSave()};section.appendChild(area)}else q.options.forEach(option=>{const button=document.createElement('button');button.className=`btn option${answers[q.id]===option?' selected':''}`;button.textContent=option;button.onclick=()=>{answers[q.id]=option;section.querySelectorAll('.option').forEach(entry=>entry.classList.toggle('selected',entry===button));queueSave()};section.appendChild(button)});root.appendChild(section)})}
$('start').onclick=async()=>{try{const response=await fetch('/api/attempt/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidateName:$('name').value,candidateNumber:$('number').value,joinCode:$('joinCode').value})});const data=await response.json();if(!response.ok)throw Error(data.error);attemptId=data.attemptId;exam=data.exam;startedAt=data.startedAt||Date.now();answers=Object.fromEntries((data.answers||[]).map(entry=>[entry.questionId,entry.answer]));securityEvents=data.securityEvents||[];$('join').classList.add('hidden');$('exam').classList.remove('hidden');render()}catch(error){message($('studentMessage'),error.message,true)}};
async function submitExam(forced=false){if(!forced&&!confirm('Submit this examination? You cannot change it afterwards.'))return;try{const response=await fetch('/api/attempt/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(responseBody())});const data=await response.json();if(!response.ok)throw Error(data.error);attemptId=null;exam=null;$('exam').innerHTML='<h2>Submitted</h2><p class="success">Your responses were saved on the school Exam Hub.</p>'}catch(error){alert(error.message)}}$('submit').onclick=()=>submitExam(false);
document.addEventListener('visibilitychange',()=>{if(!attemptId||document.visibilityState!=='hidden')return;securityEvents.push({eventType:'tab_hidden',occurredAt:Date.now()});if(exam.exitPolicy==='strict_submit'){navigator.sendBeacon('/api/attempt/submit',new Blob([JSON.stringify(responseBody())],{type:'application/json'}));attemptId=null}else queueSave()});window.addEventListener('beforeunload',event=>{if(!attemptId)return;event.preventDefault();event.returnValue='' });
setInterval(()=>{if(!exam||!startedAt)return;const remaining=Math.max(0,exam.durationMinutes*60-Math.floor((Date.now()-startedAt)/1000));$('timer').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;if(!remaining)submitExam(true)},1000);
</script></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Open Quiks Children invitation</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#6220a8;font-family:Arial,sans-serif;color:#fff}
      main{width:min(88vw,420px);padding:32px;border-radius:24px;background:rgba(255,255,255,.14);text-align:center}
      a{display:block;margin-top:18px;padding:15px;border-radius:14px;background:#fff;color:#4c1687;font-weight:800;text-decoration:none}
      p{line-height:1.55}
    </style>
  </head>
  <body>
    <main>
      <h1>Classroom invitation</h1>
      <p>Opening this invitation in Quiks Children…</p>
      <a id="open-app" href="#">Open Quiks Children</a>
      <a href="https://play.google.com/store/apps/details?id=com.quiks.mobile">Download from Google Play</a>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      const deepLink = `quiks-children://classroom-invite?${query.toString()}`;
      document.getElementById("open-app").href = deepLink;
      location.replace(deepLink);
      const fallbackTimer = setTimeout(
        () => location.replace("https://play.google.com/store/apps/details?id=com.quiks.mobile"),
        1800
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearTimeout(fallbackTimer);
      });
      window.addEventListener("pagehide", () => clearTimeout(fallbackTimer));
    </script>
  </body>
</html>

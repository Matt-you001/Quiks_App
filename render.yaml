services:
  - type: web
    name: quiks-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run proxy
    autoDeploy: true
    disk:
      name: quiks-classroom-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_VERIFIER_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_VERIFIER_REASONING_EFFORT
        value: medium
      - key: QUESTION_CANDIDATE_MULTIPLIER
        value: 1.5
      - key: MAX_QUESTION_CANDIDATES
        value: 20
      - key: CLASSROOM_STORE_PATH
        value: /var/data/classroom-store.json
      - key: SCHOOL_STORE_PATH
        value: /var/data/school-store.json
      - key: DATABASE_URL
        sync: false
      - key: QUIKS_POSTGRES_MODE
        value: shadow
      - key: QUIKS_POSTGRES_REQUIRED
        value: false
      - key: QUIKS_POSTGRES_IMPORT_JSON
        value: ""
      - key: QUIKS_OWNER_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: QUIKS_SCHOOL_EMAIL_FROM
        sync: false
      - key: QUIKS_SCHOOL_ENROLMENT_URL
        value: https://quiks.site/school-enrol.html
      - key: QUIKS_OPERATIONS_ALERT_EMAIL
        value: support@quiks.site
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_SANDBOX_API_KEY
        sync: false
      - key: QUIKS_SCHOOL_SANDBOX_PRICE_IDS_JSON
        sync: false
      - key: REVENUECAT_SCHOOL_WEBHOOK_AUTH
        sync: false
      - key: REVENUECAT_SCHOOL_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

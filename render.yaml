services:
  - type: web
    name: quiks-openai-proxy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run proxy
    autoDeploy: true
    disk:
      name: quiks-classroom-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_VERIFIER_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_VERIFIER_REASONING_EFFORT
        value: medium
      - key: QUESTION_CANDIDATE_MULTIPLIER
        value: 1.5
      - key: MAX_QUESTION_CANDIDATES
        value: 20
      - key: CLASSROOM_STORE_PATH
        value: /var/data/classroom-store.json
      - key: SCHOOL_STORE_PATH
        value: /var/data/school-store.json
      - key: QUIKS_OWNER_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: QUIKS_SCHOOL_EMAIL_FROM
        sync: false
      - key: QUIKS_SCHOOL_ENROLMENT_URL
        value: https://children.quiks.site/school-enrol
      - key: OPENAI_API_KEY
        sync: false

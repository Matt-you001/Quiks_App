services:
  - type: web
    name: quiks-openai-proxy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run proxy
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false

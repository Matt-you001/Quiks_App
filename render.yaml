services:
  - type: web
    name: quiks-openai-proxy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run proxy
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_VERIFIER_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_VERIFIER_REASONING_EFFORT
        value: medium
      - key: QUESTION_CANDIDATE_MULTIPLIER
        value: 1.5
      - key: MAX_QUESTION_CANDIDATES
        value: 20
      - key: OPENAI_API_KEY
        sync: false
